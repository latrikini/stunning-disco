name: dd

on:
  workflow_dispatch:
    inputs:
      rate:
        description: "vitesse audio et jeu (0.5 = moitié)"
        default: "0.5"
      delay_s:
        description: "délai avant ralentissement du jeu (s)"
        default: "13"

env:
  MEDIAFIRE_PAGE: "https://www.mediafire.com/file/jx838utr87l604s/CairoV2_by_SG.ipa/file"

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      RATE: ${{ inputs.rate }}
      DELAY: ${{ inputs.delay_s }}
    steps:
      - name: install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg llvm clang lld libssl-dev zip unzip python3 gcc
          LLD=$(command -v lld)
          test -n "$LLD" || { echo "lld introuvable"; exit 1; }
          echo "LLD=$LLD" >> "$GITHUB_ENV"
          echo "resolved: $LLD"

      - name: get iphoneos sdk
        run: |
          git clone --depth 1 https://github.com/theos/sdks sdks
          SDK=$(find sdks -maxdepth 1 -type d -name 'iPhoneOS*.sdk' | sort -V | tail -1)
          test -n "$SDK" || { echo "sdk introuvable"; exit 1; }
          echo "SDK=$PWD/$SDK" >> "$GITHUB_ENV"

      - name: resolve + download ipa
        run: |
          DIRECT=$(curl -sL "$MEDIAFIRE_PAGE" | grep -oE 'https://download[^"]+' | head -1)
          test -n "$DIRECT" || { echo "lien direct introuvable"; exit 1; }
          curl -L --fail -o in.ipa "$DIRECT"
          sha256sum in.ipa | tee ipa.sha256
          mkdir work && cd work && unzip -q ../in.ipa

      - name: analyse (bundle subwaysurfers)
        run: |
          cd work
          APP=$(ls -d Payload/*.app | grep -i subway | head -1)
          [ -n "$APP" ] || APP=$(ls -d Payload/*.app | head -1)
          BIN="$APP/$(python3 -c "import plistlib,sys; print(plistlib.load(open(sys.argv[1],'rb'))['CFBundleExecutable'])" "$APP/Info.plist")"
          {
            echo "== app =="
            echo "APP=$APP"
            python3 -c "import plistlib,sys; p=plistlib.load(open(sys.argv[1],'rb')); [print(k, '=', p.get(k)) for k in ('CFBundleIdentifier','CFBundleShortVersionString','MinimumOSVersion')]" "$APP/Info.plist"
            echo "== binaire =="
            file "$BIN" || true
            llvm-objdump --macho --private-headers "$BIN" | grep -A2 'LC_LOAD_DYLIB\|LC_RPATH' | head -60 || true
            echo "== audio =="
            find "$APP" \( -name '*.mp3' -o -name '*.m4a' -o -name '*.wav' -o -name '*.caf' \) -exec ls -la {} \;
            echo "== frameworks =="
            ls "$APP/Frameworks" 2>/dev/null || echo "aucun"
          } | tee ../analysis.txt

      - name: slow audio (atempo, pitch conservé)
        run: |
          cd work
          APP=$(ls -d Payload/*.app | grep -i subway | head -1)
          [ -n "$APP" ] || APP=$(ls -d Payload/*.app | head -1)
          find "$APP" \( -name '*.mp3' -o -name '*.m4a' -o -name '*.wav' \) -print0 | while IFS= read -r -d '' f; do
            ext="${f##*.}"; tmp="${f}.slow.${ext}"
            case "$ext" in
              mp3) codec="libmp3lame" ;;
              m4a) codec="aac" ;;
              wav) codec="pcm_s16le" ;;
            esac
            ffmpeg -y -loglevel error -i "$f" -filter:a "atempo=$RATE" -vn -c:a "$codec" "$tmp"
            mv "$tmp" "$f"
            echo "slowed: $f"
          done
          find "$APP" -name '*.caf' | sed 's/^/caf non traité: /' || true

      - name: build speed.dylib (clang target iOS)
        run: |
          mkdir -p dylib
          cat > dylib/speed.m <<'EOF'
          #import <Foundation/Foundation.h>
          #import <QuartzCore/QuartzCore.h>
          #include <mach/mach_time.h>
          #include <dispatch/dispatch.h>
          #include "fishhook.h"

          static double gRate = __RATE__;
          static double gDelay = __DELAY__;

          static volatile BOOL gActive = NO;
          static CFTimeInterval gR0cf = 0;
          static uint64_t gR0mach = 0;

          static CFTimeInterval (*orig_CACurrentMediaTime)(void);
          static uint64_t (*orig_mach_absolute_time)(void);

          static CFTimeInterval hook_CACurrentMediaTime(void) {
              CFTimeInterval r = orig_CACurrentMediaTime();
              if (!gActive) return r;
              return gR0cf + (r - gR0cf) * gRate;
          }

          static uint64_t hook_mach_absolute_time(void) {
              uint64_t r = orig_mach_absolute_time();
              if (!gActive) return r;
              return gR0mach + (uint64_t)((double)(r - gR0mach) * gRate);
          }

          __attribute__((constructor))
          static void speed_init(void) {
              rebind_symbols((struct rebinding[]){
                  {"CACurrentMediaTime", hook_CACurrentMediaTime, (void **)&orig_CACurrentMediaTime},
                  {"mach_absolute_time", hook_mach_absolute_time, (void **)&orig_mach_absolute_time},
              }, 2);

              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(gDelay * NSEC_PER_SEC)),
                             dispatch_get_main_queue(), ^{
                  gR0cf = orig_CACurrentMediaTime();
                  gR0mach = orig_mach_absolute_time();
                  gActive = YES;
              });
          }
          EOF
          sed -i "s/__RATE__/$RATE/; s/__DELAY__/$DELAY/" dylib/speed.m

          git clone --depth 1 https://github.com/facebook/fishhook fishhook

          TGT="-target arm64-apple-ios14.0 -isysroot $SDK -fobjc-arc -O2"
          clang $TGT -c fishhook/fishhook.c -o fishhook.o
          clang $TGT -fmodules -I fishhook -c dylib/speed.m -o speed.o

          "$LLD" -flavor darwin -dylib -arch arm64 -platform_version ios 14.0 14.0 \
            -syslibroot "$SDK" -install_name @rpath/speed.dylib \
            -framework Foundation -framework QuartzCore -lobjc -lSystem \
            fishhook.o speed.o -o speed.dylib

      - name: build mach-o patcher (natif, sans sdk apple)
        run: |
          cat > patch_dylib.c <<'EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>

          #define MH_MAGIC_64 0xfeedfacfu
          #define FAT_MAGIC   0xcafebabeu
          #define FAT_CIGAM   0xbebafecau
          #define LC_SEGMENT_64 0x19u
          #define LC_LOAD_DYLIB 0x0cu

          typedef struct { uint32_t magic; int32_t cputype; int32_t cpusubtype;
              uint32_t filetype; uint32_t ncmds; uint32_t sizeofcmds; uint32_t flags; uint32_t reserved; } mh64_t;
          typedef struct { uint32_t cmd; uint32_t cmdsize; } lc_t;
          typedef struct { uint32_t name_off; uint32_t timestamp; uint32_t cur_ver; uint32_t compat_ver; } dylib_t;
          typedef struct { uint32_t cmd; uint32_t cmdsize; dylib_t dylib; } dylib_cmd_t;
          typedef struct { uint32_t cmd; uint32_t cmdsize; char segname[16];
              uint64_t vmaddr; uint64_t vmsize; uint64_t fileoff; uint64_t filesize;
              int32_t maxprot; int32_t initprot; uint32_t nsects; uint32_t flags; } seg64_t;
          typedef struct { char sectname[16]; char segname[16]; uint64_t addr; uint64_t size;
              uint32_t offset; uint32_t align; uint32_t reloff; uint32_t nreloc;
              uint32_t flags; uint32_t r1; uint32_t r2; uint32_t r3; } sect64_t;

          int main(int argc, char **argv) {
              if (argc != 3) { fprintf(stderr, "usage: %s <dylib_install_path> <macho_binary>\n", argv[0]); return 1; }
              const char *dylib_path = argv[1];
              const char *bin_path = argv[2];

              FILE *f = fopen(bin_path, "r+b");
              if (!f) { perror("fopen"); return 1; }
              fseek(f, 0, SEEK_END);
              long fsize = ftell(f);
              fseek(f, 0, SEEK_SET);
              unsigned char *buf = malloc(fsize);
              if (fread(buf, 1, fsize, f) != (size_t)fsize) { fprintf(stderr, "short read\n"); return 1; }

              uint32_t magic; memcpy(&magic, buf, 4);
              if (magic == FAT_MAGIC || magic == FAT_CIGAM) {
                  fprintf(stderr, "binaire fat (multi-arch), pas supporté ici — ipa app store attendu thin arm64\n");
                  return 1;
              }
              if (magic != MH_MAGIC_64) { fprintf(stderr, "pas un mach-o 64 bits (magic=%08x)\n", magic); return 1; }

              mh64_t *hdr = (mh64_t *)buf;
              size_t lc_start = sizeof(mh64_t);
              size_t lc_end = lc_start + hdr->sizeofcmds;

              uint32_t min_sect_off = 0xFFFFFFFFu;
              size_t cur = lc_start;
              for (uint32_t i = 0; i < hdr->ncmds; i++) {
                  lc_t *lc = (lc_t *)(buf + cur);
                  if (lc->cmd == LC_SEGMENT_64) {
                      seg64_t *seg = (seg64_t *)(buf + cur);
                      unsigned char *secp = buf + cur + sizeof(seg64_t);
                      for (uint32_t s = 0; s < seg->nsects; s++) {
                          sect64_t *sec = (sect64_t *)secp;
                          if (sec->offset > 0 && sec->offset < min_sect_off) min_sect_off = sec->offset;
                          secp += sizeof(sect64_t);
                      }
                  }
                  cur += lc->cmdsize;
              }
              if (min_sect_off == 0xFFFFFFFFu) { fprintf(stderr, "pad de header introuvable\n"); return 1; }

              size_t name_len = strlen(dylib_path) + 1;
              size_t cmdsize = sizeof(dylib_cmd_t) + name_len;
              cmdsize = (cmdsize + 7) & ~7UL;
              size_t avail = min_sect_off - lc_end;

              if (avail < cmdsize) {
                  fprintf(stderr, "pas assez de pad: besoin %zu, dispo %zu\n", cmdsize, avail);
                  return 1;
              }

              unsigned char *newcmd = calloc(1, cmdsize);
              dylib_cmd_t *dc = (dylib_cmd_t *)newcmd;
              dc->cmd = LC_LOAD_DYLIB;
              dc->cmdsize = (uint32_t)cmdsize;
              dc->dylib.name_off = sizeof(dylib_cmd_t);
              dc->dylib.timestamp = 2;
              dc->dylib.cur_ver = 0x10000;
              dc->dylib.compat_ver = 0x10000;
              memcpy(newcmd + sizeof(dylib_cmd_t), dylib_path, name_len);

              memcpy(buf + lc_end, newcmd, cmdsize);
              hdr->ncmds += 1;
              hdr->sizeofcmds += (uint32_t)cmdsize;

              fseek(f, 0, SEEK_SET);
              fwrite(buf, 1, fsize, f);
              fclose(f);
              printf("LC_LOAD_DYLIB inséré: %s (cmdsize=%zu, pad dispo=%zu)\n", dylib_path, cmdsize, avail);
              return 0;
          }
          EOF
          gcc -O2 -o patch_dylib_bin patch_dylib.c

      - name: inject
        run: |
          cd work
          APP=$(ls -d Payload/*.app | grep -i subway | head -1)
          [ -n "$APP" ] || APP=$(ls -d Payload/*.app | head -1)
          mkdir -p "$APP/Frameworks"
          cp ../speed.dylib "$APP/Frameworks/speed.dylib"
          BIN="$APP/$(python3 -c "import plistlib,sys; print(plistlib.load(open(sys.argv[1],'rb'))['CFBundleExecutable'])" "$APP/Info.plist")"
          ../patch_dylib_bin "@rpath/speed.dylib" "$BIN"
          cd ..

      - name: repack
        run: |
          cd work && zip -qr ../patched.ipa Payload && cd ..
          sha256sum patched.ipa > patched.sha256

      - name: sign (optionnel, skip si pas de cert)
        env:
          P12_B64: ${{ secrets.IOS_CERT_P12_B64 }}
          P12_PASS: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROFILE_B64 }}
        run: |
          if [ -z "$P12_B64" ]; then
            echo "pas de cert, signature skippée"
            exit 0
          fi
          git clone --depth 1 https://github.com/zhlynn/zsign zsign && make -C zsign
          echo "$P12_B64" | base64 -d > cert.p12
          echo "$PROFILE_B64" | base64 -d > profile.mobileprovision
          ./zsign/zsign -k cert.p12 -p "$P12_PASS" -m profile.mobileprovision -o signed.ipa patched.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: analysis
          path: |
            analysis.txt
            ipa.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: patched-ipa
          if-no-files-found: ignore
          path: |
            patched.ipa
            patched.sha256
            signed.ipa
